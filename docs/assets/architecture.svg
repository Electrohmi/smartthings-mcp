<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="300" fill="#ffffff" rx="12"/>

  <!-- Claude box -->
  <rect x="30" y="100" width="190" height="100" rx="10" fill="#f3f0ff" stroke="#7c5cff" stroke-width="2"/>
  <text x="125" y="140" text-anchor="middle" font-size="16" font-weight="600" fill="#3a2d78">Claude</text>
  <text x="125" y="162" text-anchor="middle" font-size="12" fill="#5c4fa3">Desktop / Code / Web</text>

  <!-- arrow 1 -->
  <line x1="220" y1="150" x2="330" y2="150" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="138" text-anchor="middle" font-size="11" fill="#666">MCP</text>
  <text x="275" y="170" text-anchor="middle" font-size="10" fill="#888">stdio / SSE / stream</text>

  <!-- MCP Server box -->
  <rect x="330" y="90" width="220" height="120" rx="10" fill="#eaf6ff" stroke="#2f9bd6" stroke-width="2"/>
  <text x="440" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#0f4c75">SmartThings MCP</text>
  <text x="440" y="150" text-anchor="middle" font-size="12" fill="#1f6f9c">Server (Go)</text>
  <text x="440" y="172" text-anchor="middle" font-size="11" fill="#3a86ad">Tools · Resources · Prompts</text>

  <!-- arrow 2 -->
  <line x1="550" y1="150" x2="660" y2="150" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="138" text-anchor="middle" font-size="11" fill="#666">REST API</text>
  <text x="605" y="170" text-anchor="middle" font-size="10" fill="#888">Bearer PAT</text>

  <!-- SmartThings Cloud box -->
  <rect x="660" y="90" width="200" height="120" rx="10" fill="#fff4e5" stroke="#e8912d" stroke-width="2"/>
  <text x="760" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#8a4f0a">SmartThings</text>
  <text x="760" y="150" text-anchor="middle" font-size="12" fill="#9c5c14">Cloud API</text>
  <text x="760" y="172" text-anchor="middle" font-size="11" fill="#a8681f">Devices · Hubs · Scenes</text>

  <!-- bottom label -->
  <text x="480" y="260" text-anchor="middle" font-size="12" fill="#999">우리집 기기(조명·플러그·센서 등)를 Claude 대화로 제어</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a8a8a"/>
    </marker>
  </defs>
</svg>
